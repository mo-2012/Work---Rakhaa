<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مستحقات العمالة</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div id="bk" aria-hidden="true"></div>

<div id="gate"><div class="wrap">
<h1>مستحقات العمالة</h1>
<p>اكتب اسمك، وبعدين اختار القسم اللي عايز تشوفه. كل قسم ليه لوحة لوحده.</p>
<input id="nm" class="field" placeholder="اسمك" autocomplete="name" maxlength="40" aria-label="اسمك">
<div class="hint" id="hint"></div>
<div id="picks"></div>
</div></div>

<div id="app" hidden>
<header id="hd"><div class="wrap"><div class="glass bar">
<button class="ib" data-a="back" aria-label="تغيير القسم"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
<div class="tt"><b id="ht"></b><small id="hs"></small></div>
<button class="ib" data-a="up" aria-label="رفع ملف محدّث"><svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></button>
</div></div></header>
<div id="flt"><div class="wrap">
<div class="seg glass" role="group" aria-label="الفترة">
<button data-a="pr" data-k="all">كل الفترة</button><button data-a="pr" data-k="7">آخر 7 أيام</button><button data-a="pr" data-k="14">آخر 14 يوم</button><button data-a="pr" data-k="c">مخصّص</button>
</div>
<div class="dr glass" id="dr" hidden><label>من<input type="date" id="df"></label><label>إلى<input type="date" id="dt"></label></div>
<p class="rng" id="rng"></p>
</div></div>
<main id="mn"><div class="wrap view" id="vw"></div></main>
<nav id="nv" aria-label="الأقسام"><div class="tabs glass">
<button data-t="ov"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>الملخص</button>
<button data-t="wk"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.3a3 3 0 010 5.4M18 14.4c1.9.8 3 2.7 3 5.6"/></svg>الأفراد</button>
<button data-t="fc"><svg viewBox="0 0 24 24"><path d="M3 20V10l6 3.5V10l6 3.5V4h5v16zM8 20v-3M13 20v-3"/></svg>المصانع</button>
<button data-t="en"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>إدخال</button>
<button data-t="lg"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>السجل</button>
</div></nav>
</div>

<div class="ov" id="ovl" hidden><div class="sheet" id="sh" role="dialog" aria-modal="true"></div></div>
<div id="toast" aria-live="polite"></div>
<input type="file" id="fi" accept=".xlsx,.xls" hidden>

<script src="data.js"></script>
<script src="app.js"></script>
<script src="extras.js"></script>
</body>
</html>
